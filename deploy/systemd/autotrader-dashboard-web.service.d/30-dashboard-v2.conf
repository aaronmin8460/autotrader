# /etc/systemd/system/autotrader-dashboard-web.service.d/30-dashboard-v2.conf
# Tell the frontend where the two Dashboard V2 API processes listen.
#
# A drop-in, not an edit, layered after 20-equity-paper.conf by lexical order.
# It changes nothing about where the frontend runs or as whom; it adds the two
# loopback origins next.config.mjs rewrites to:
#
#   /api/equity-a1b-shadow/*  -> 127.0.0.1:8003  autotrader-equity-a1b-shadow-api
#   /api/market-charts/*      -> 127.0.0.1:8004  autotrader-market-charts-api
#
# Both are read at server start and never shipped to the browser. Reversible
# by deleting this file:
#
#     rm /etc/systemd/system/autotrader-dashboard-web.service.d/30-dashboard-v2.conf
#     systemctl daemon-reload && systemctl restart autotrader-dashboard-web
#
# THE API SPLIT IS STILL THE POINT. Five records, five processes, five
# identities; one public origin, one basic_auth boundary, one CSP. The frontend
# still holds no credential and no activation file.

[Service]
Environment=EQUITY_A1B_SHADOW_API_ORIGIN=http://127.0.0.1:8003
Environment=MARKET_CHARTS_API_ORIGIN=http://127.0.0.1:8004
