# Serve the frontend build that knows about the Equity Paper page.
#
# A drop-in, not an edit, and it supersedes 10-equity-shadow.conf by ordering:
# systemd applies drop-ins in lexical order and later assignments win, so this
# file moves the frontend without either file having to be rewritten. Reversible
# by deleting it:
#
#     rm /etc/systemd/system/autotrader-dashboard-web.service.d/20-equity-paper.conf
#     systemctl daemon-reload && systemctl restart autotrader-dashboard-web
#
# WHY THE FRONTEND MOVES AGAIN
#
# The dashboard now shows three records and the frontend has to know about all
# three. The Equity Paper tree carries the same repository at a descendant of
# the shadow's commit, so its frontend is the same application plus one more
# page; its node_modules is a copy of the shadow tree's rather than a fresh
# install, because npm on this host is known fragile and the lockfile is
# unchanged between the two commits.
#
# /opt/autotrader/app - the crypto production checkout autotrader-crypto.service
# was started from - is still left byte-for-byte alone, as it was by the shadow
# drop-in.
#
# THE API SPLIT IS THE POINT AND IS UNCHANGED
#
# Next.js rewrites /api/dashboard/* to :8000 (operational API, reading the
# crypto store as `autotrader`), /api/equity-shadow/* to :8001 (shadow API,
# reading the observation record as `atshadow`), and /api/equity-paper/* to
# :8002 (paper API, reading the equity paper store as `ateqpaper`). One public
# origin, one basic_auth boundary, one CSP - three records that never share a
# process or a database. One of those three stores is schema 6 while the
# process that would serve it here is schema 7, which is why the separation is
# enforced by identity rather than by convention.
#
# User=ateqpaper: this tier renders bytes into a browser and holds no
# credential by design. It is given the identity of the newest and least
# privileged of the three readers.
#
# The empty assignments are required: systemd appends to these directives, so
# clearing each one first is what replaces the earlier value rather than adding
# a second.

[Unit]
ConditionPathExists=
ConditionPathExists=/opt/autotrader-equity-paper/app/dashboard/frontend/.next
ConditionPathExists=/opt/autotrader-equity-paper/app/dashboard/frontend/node_modules/.bin/next

[Service]
User=ateqpaper
Group=ateqpaper
WorkingDirectory=/opt/autotrader-equity-paper/app/dashboard/frontend

Environment=EQUITY_SHADOW_API_ORIGIN=http://127.0.0.1:8001
Environment=EQUITY_PAPER_API_ORIGIN=http://127.0.0.1:8002

ExecStart=
ExecStart=/opt/autotrader-equity-paper/app/dashboard/frontend/node_modules/.bin/next start --hostname 127.0.0.1 --port ${AUTOTRADER_DASHBOARD_WEB_PORT}

ReadWritePaths=
ReadWritePaths=/opt/autotrader-equity-paper/app/dashboard/frontend/.next
