# /etc/systemd/system/autotrader-equity-paper-api.service.d/10-dashboard-venv.conf
# Serve the Equity Paper API from the dedicated dashboard virtualenv.
#
# A drop-in, not an edit. The packaged unit at
# /usr/lib/systemd/system/autotrader-equity-paper-api.service stays verbatim,
# so this change is reviewable in one file and reversible by deleting it:
#
#     rm /etc/systemd/system/autotrader-equity-paper-api.service.d/10-dashboard-venv.conf
#     systemctl daemon-reload && systemctl restart autotrader-equity-paper-api
#
# WHY THE INTERPRETER MOVES BUT THE IDENTITY DOES NOT
#
# /opt/autotrader-equity-paper/venv is shared by this API and by the live
# equity paper trading runtime, and the package there is a non-editable copy
# install. Changing the dashboard's read models by reinstalling into that venv
# would, for the seconds between uninstall and install, leave no `autotrader`
# package under a running trader. The dashboard tree and venv under
# /opt/autotrader-dashboard exist so that no dashboard deploy ever writes into
# a venv a trading or observing process depends on.
#
# The identity stays `ateqpaper`, with the same supplementary groups, reading
# the same stores through the same environment file. Only the interpreter and
# the working directory move. The empty assignments are required: systemd
# appends to these directives, so clearing each one first is what replaces the
# packaged value rather than adding a second.

[Unit]
ConditionPathExists=
ConditionPathExists=/etc/autotrader/autotrader-equity-paper.env
ConditionPathExists=/opt/autotrader-dashboard/venv/bin/python

[Service]
WorkingDirectory=/opt/autotrader-dashboard/app

ExecStart=
ExecStart=/opt/autotrader-dashboard/venv/bin/python -m autotrader.dashboard.equity_paper_api --port ${AUTOTRADER_EQUITY_PAPER_API_PORT}
