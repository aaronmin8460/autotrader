[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autotrader"
description = "Personal automated 24/7 crypto trading system (BTC/USD + ETH/USD, Alpaca paper trading)."
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "alpaca-py",
    "numpy",
    "pandas",
    "pyarrow",
    "pydantic",
    "typer",
]

[project.optional-dependencies]
# The read-only operations dashboard (C10). Optional because the trading
# system itself does not need a web framework to run, and a process that
# trades should not carry one it never imports.
dashboard = [
    "fastapi",
    "uvicorn[standard]",
]
# tests/test_web_publish_browser.py drives the published dashboard in Chromium,
# because nothing that fails to execute JavaScript can tell a rendered page from
# a blank one - both return 200. Deliberately NOT in `dev`: the deploy script
# installs `dev` on the VPS and runs the suite there, and a trading host has no
# reason to carry a browser. The test skips itself when this extra is absent.
browser = [
    "playwright",
]
dev = [
    "pytest",
    "ruff",
    # tests/test_dashboard.py drives the real application through Starlette's
    # TestClient, which needs both the framework and httpx.
    "fastapi",
    "uvicorn[standard]",
    "httpx",
]

[project.scripts]
autotrader = "autotrader.cli:main"
autotrader-smoke = "autotrader.smoke.cli:main"

[tool.setuptools.dynamic]
version = { attr = "autotrader.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
