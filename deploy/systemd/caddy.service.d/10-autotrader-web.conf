# Feed the Caddy package's own unit the AutoTrader publish configuration.
#
# Install to /etc/systemd/system/caddy.service.d/10-autotrader-web.conf.
#
# A drop-in rather than an edit to the packaged unit: `apt upgrade caddy`
# replaces /usr/lib/systemd/system/caddy.service and would silently take the
# hostname and the password hash with it, which fails as "the dashboard
# stopped having a certificate" some weeks after anybody touched it.
#
# This is not one of the `autotrader-*` units. It configures a third-party
# service, it is installed by `autotrader-publish-web` rather than by
# `autotrader-deploy`, and removing it returns Caddy to its packaged
# behaviour.

[Service]
# 0640 root:caddy. systemd reads it as PID 1 before dropping privileges, so
# the caddy user never needs to open it itself.
EnvironmentFile=/etc/autotrader/autotrader.web.env

# The packaged unit runs `caddy run --environ`, which prints the whole process
# environment to stdout at every start. The line above has just put the
# dashboard's bcrypt hash into that environment, so with the flag left in place
# journald holds a copy of the only credential the dashboard has - readable by
# every member of `adm`, and kept for as long as the journal keeps anything.
#
# The empty assignment is not decoration: a drop-in adds to the list systemd
# already has, and a Type=notify service accepts exactly one ExecStart, so
# clearing the list first is the only way to replace the command rather than
# collide with it.
#
# This pins the command, which means an upgrade that changes it is an upgrade
# this drop-in ignores. That is the trade: a pinned path is visible the first
# time the service fails to start, a leaked credential is not.
ExecStart=
ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile

# systemd creates /var/log/caddy owned by the service user before ExecStart
# runs, on every boot. Without it, ownership of the access log is whoever
# created the file first - and `caddy validate`, which provisions the logging
# module and therefore opens the file, runs as root during a publish. Caddy
# then cannot open its own log and refuses to start, reporting a permission
# error against a directory that looks perfectly correct.
LogsDirectory=caddy
LogsDirectoryMode=0750
